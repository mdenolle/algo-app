<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Algo World</title>
  <link rel="icon" href="../icon.svg">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0ff; font-family: 'Nunito', system-ui, sans-serif; color: #14233a; }
    #world { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #hud { position: fixed; top: 10px; left: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.72); font: 600 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none; }
    #title { position: fixed; top: 10px; right: 10px; padding: 6px 12px; border-radius: 12px; background: rgba(255,255,255,.8); font-weight: 900; font-size: 13px; text-decoration: none; color: #0754a6; }
    #help { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,.7); font-size: 12px; font-weight: 700; pointer-events: none; white-space: nowrap; }
    #joystick { position: fixed; left: 24px; bottom: 28px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.7); touch-action: none; display: none; }
    #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: #ffd524; box-shadow: 0 4px 10px rgba(0,0,0,.2); pointer-events: none; }
    #jump { position: fixed; right: 28px; bottom: 40px; width: 78px; height: 78px; border-radius: 50%; border: 0; background: #ffd524; font-weight: 900; font-size: 14px; color: #3a3a27; box-shadow: 0 5px 0 #d9ad20; touch-action: none; display: none; user-select: none; -webkit-user-select: none; }
    @media (pointer: coarse) { #joystick, #jump { display: block; } #help { display: none; } }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0877e8; color: white; font-size: 22px; font-weight: 900; }
    #loading[hidden] { display: none; }
    #loading small { display: block; margin-top: 8px; font-size: 13px; font-weight: 700; opacity: .85; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="world"></canvas>
  <div id="hud">loading…</div>
  <a id="title" href="../">🌍 Algo World · prototype</a>
  <div id="help">WASD / arrows walk · Shift run · Space jump · drag to look · wheel to zoom</div>
  <div id="joystick"><div id="knob"></div></div>
  <button id="jump">JUMP</button>
  <div id="loading"><div>Building your planet…<small>generating the ground under your feet</small></div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
