<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Algo World</title>
  <link rel="icon" href="../icon.svg">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0ff; font-family: 'Nunito', system-ui, sans-serif; color: #14233a; }
    #world { display: block; width: 100vw; height: 100vh; touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
    button { font-family: inherit; }
    #hud { position: fixed; top: 10px; left: 10px; padding: 6px 9px; border-radius: 10px; background: rgba(255,255,255,.6); font: 600 10px/1.5 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none; opacity: .85; }
    #title { position: fixed; top: 10px; right: 10px; padding: 6px 12px; border-radius: 12px; background: rgba(255,255,255,.8); font-weight: 900; font-size: 13px; text-decoration: none; color: #0754a6; }
    #clock { position: fixed; top: 44px; right: 10px; padding: 4px 10px; border-radius: 10px; background: rgba(255,255,255,.7); font: 800 12px ui-monospace, Menlo, monospace; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; }
    #crosshair:before, #crosshair:after { content: ''; position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 2px rgba(0,0,0,.6); }
    #crosshair:before { left: 8px; top: 0; width: 2px; height: 18px; }
    #crosshair:after { top: 8px; left: 0; width: 18px; height: 2px; }
    #vitals { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
    #hearts { font-size: 15px; letter-spacing: 1px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
    .meter { display: flex; align-items: center; gap: 6px; }
    .meter[hidden] { display: none; }
    .meter .icon { font-size: 14px; }
    .bar { width: 160px; height: 10px; border-radius: 6px; background: rgba(0,0,0,.35); overflow: hidden; border: 1px solid rgba(255,255,255,.6); }
    .bar > div { height: 100%; width: 100%; background: #ffd524; transition: width .3s; }
    .bar > div.low { background: #ec3d3d; }
    #air-fill { background: #9fc3e9; }
    #messages { position: fixed; left: 50%; top: 58%; transform: translateX(-50%); text-align: center; font-weight: 900; font-size: 16px; color: white; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: pre-line; pointer-events: none; }
    #hotbar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; }
    .slot { position: relative; width: 52px; height: 52px; border: 2px solid rgba(255,255,255,.7); border-radius: 12px; background: rgba(20,35,58,.55); display: grid; place-items: center; padding: 0; touch-action: none; }
    .slot.selected { border-color: #ffd524; background: rgba(20,35,58,.85); transform: translateY(-4px); box-shadow: 0 0 0 2px rgba(255,213,36,.5); }
    .slot.empty .brick, .slot.empty .item { opacity: .35; }
    .slot .count { position: absolute; right: 4px; bottom: 2px; font-size: 11px; color: white; }
    .slot small { position: absolute; left: 5px; top: 2px; font-size: 9px; color: rgba(255,255,255,.7); }
    .brick { position: relative; display: block; width: 26px; height: 20px; border-radius: 3px; background: var(--c); box-shadow: inset 0 -5px 0 rgba(0,0,0,.2); }
    .brick:before, .brick:after { content: ''; position: absolute; top: -5px; width: 8px; height: 6px; border-radius: 50% 50% 1px 1px; background: var(--c); filter: brightness(1.15); }
    .brick:before { left: 4px; } .brick:after { right: 4px; }
    .brick.big { width: 54px; height: 42px; border-radius: 5px; box-shadow: inset 0 -10px 0 rgba(0,0,0,.2); }
    .brick.big:before, .brick.big:after { top: -9px; width: 16px; height: 11px; } .brick.big:before { left: 8px; } .brick.big:after { right: 8px; }
    .item { font-size: 24px; } .item.big { font-size: 46px; }
    #preview { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 12px 10px; border-radius: 12px; background: rgba(255,255,255,.55); pointer-events: none; }
    #preview .label { font-weight: 900; font-size: 13px; }
    #help { position: fixed; bottom: 12px; right: 12px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.7); font-size: 11px; font-weight: 700; pointer-events: none; text-align: right; line-height: 1.5; }
    #joystick { position: fixed; left: 24px; bottom: 28px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.45); border: 3px solid rgba(255,255,255,.9); box-shadow: 0 6px 18px rgba(0,0,0,.25); touch-action: none; display: none; }
    #joystick:before { content: 'MOVE'; position: absolute; left: 0; right: 0; top: -22px; text-align: center; font-weight: 900; font-size: 12px; color: white; text-shadow: 0 1px 3px rgba(0,0,0,.6); letter-spacing: 1px; }
    #joystick .arrow { position: absolute; font-size: 14px; color: rgba(20,35,58,.55); font-weight: 900; }
    #knob { position: absolute; left: 39px; top: 39px; width: 52px; height: 52px; border-radius: 50%; background: #ffd524; box-shadow: 0 4px 10px rgba(0,0,0,.25); pointer-events: none; }
    #tips { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); padding: 10px 16px; border-radius: 14px; background: rgba(20,35,58,.8); color: white; font-weight: 800; font-size: 14px; line-height: 1.6; text-align: center; pointer-events: none; white-space: pre-line; transition: opacity .6s; }
    #tips[hidden] { display: none; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 4px 0 16px; font-size: 13px; font-weight: 700; }
    .controls b { display: inline-block; min-width: 54px; padding: 2px 6px; margin-right: 6px; border-radius: 6px; background: #e3f3ff; color: #0754a6; text-align: center; font-size: 12px; }
    #touch { position: fixed; right: 18px; bottom: 24px; display: none; grid-template-columns: 1fr 1fr; gap: 10px; }
    #touch button { width: 70px; height: 70px; border-radius: 50%; border: 0; font-weight: 900; font-size: 13px; color: #3a3a27; box-shadow: 0 5px 0 rgba(0,0,0,.25); touch-action: none; user-select: none; -webkit-user-select: none; }
    #jump { background: #ffd524; } #dig { background: #a0a5a9; } #build { background: #bbe90b; } #eat { background: #e4adc8; }
    @media (pointer: coarse) { #joystick, #touch { display: grid; } #help { display: none; } #hud { display: none; } #vitals { bottom: 132px; } #preview { bottom: 68px; } .slot { width: 42px; height: 42px; } .bar { width: 120px; } }
    /* Short screens (a phone held sideways, small laptop windows): vitals at the top, no help box. */
    @media (max-height: 520px) { #vitals { top: 8px; bottom: auto; } #hearts { font-size: 13px; } .bar { width: 120px; height: 8px; } #help, #hud { display: none; } #preview { bottom: 62px; padding: 4px 10px 6px; } .brick.big { width: 36px; height: 28px; } .item.big { font-size: 30px; } #tips { top: 30%; font-size: 13px; } #clock { top: 8px; right: 10px; } #title { display: none; } }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,119,232,.92); color: white; padding: 20px; }
    .overlay[hidden] { display: none; }
    .card { max-width: 440px; width: 100%; background: white; color: #14233a; border-radius: 22px; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .card h1 { margin: 0 0 6px; font-size: 26px; color: #0754a6; } .card h2 { margin: 0 0 8px; font-size: 22px; color: #a52626; }
    .card ul { padding-left: 20px; margin: 10px 0 16px; line-height: 1.5; font-weight: 700; font-size: 14px; }
    .card table { width: 100%; border-collapse: collapse; margin: 6px 0 16px; font-weight: 700; } .card td { padding: 5px 0; border-bottom: 1px solid #e3f3ff; } .card td:last-child { text-align: right; }
    .card button { width: 100%; padding: 14px; border: 0; border-radius: 14px; background: #ffd524; color: #3a3a27; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 #d9ad20; cursor: pointer; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0877e8; color: white; font-size: 22px; font-weight: 900; z-index: 5; }
    #loading[hidden] { display: none; }
    #loading small { display: block; margin-top: 8px; font-size: 13px; font-weight: 700; opacity: .85; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="world"></canvas>
  <div id="crosshair"></div>
  <div id="hud">loading…</div>
  <a id="title" href="../">🌍 Algo World · survival</a>
  <div id="clock">0:00</div>
  <div id="vitals">
    <div id="hearts"></div>
    <div class="meter"><span class="icon">🍎</span><div class="bar"><div id="hunger-fill"></div></div></div>
    <div class="meter" id="air" hidden><span class="icon">💨</span><div class="bar"><div id="air-fill"></div></div></div>
  </div>
  <div id="messages"></div>
  <div id="preview"></div>
  <div id="hotbar"></div>
  <div id="help">WASD walk · Shift run · Space jump / swim up<br>drag to look · wheel to zoom<br>click or E dig · right-click or R build · 1–8 pick · F eat</div>
  <div id="joystick"><span class="arrow" style="left:58px;top:6px">▲</span><span class="arrow" style="left:58px;bottom:6px">▼</span><span class="arrow" style="left:8px;top:54px">◀</span><span class="arrow" style="right:8px;top:54px">▶</span><div id="knob"></div></div>
  <div id="tips" hidden></div>
  <div id="touch"><button id="dig">DIG</button><button id="build">BUILD</button><button id="eat">EAT</button><button id="jump">JUMP</button></div>
  <div id="start" class="overlay" hidden><div class="card"><h1 id="start-title">Algo World: Survival</h1><div class="controls" id="controls"></div><ul id="start-rules"></ul><button id="play">Play ▶</button></div></div>
  <div id="gameover" class="overlay" hidden><div class="card"><h2>Game over</h2><p id="cause"></p><table id="game-stats"></table><button id="retry">Try again on this planet ↻</button></div></div>
  <div id="loading"><div>Building your planet…<small>generating the ground under your feet</small></div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
